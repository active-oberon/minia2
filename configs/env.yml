Linux64:
  DEFINES: "--define=UNIX,AMD64"
  FILEFORMAT: ""
  EXTENSION: "GofUu"
  SYMBOLFILEEXCEPTION: ".SymUu"
  COMPILEOPTIONS: "-p=Unix64"
  FILENAME: "oberon"
  DISPLACEMENT: ""
  MODULE_LIST: "configs/moduleListLinux.txt"

Win64:
  DEFINES: "--define=WINDOWS,AMD64"
  FILEFORMAT: "--fileFormat=PE64CUI"
  EXTENSION: "GofWw"
  SYMBOLFILEEXCEPTION: ".SymWw"
  COMPILEOPTIONS: "-p=Win64"
  FILENAME: "oberon.exe"
  DISPLACEMENT: "--displacement=401000H"
  MODULE_LIST: "configs/moduleListWin.txt"

# The 32-bit targets. Both boot the same module list as Linux64 -- it names modules, and every one
# of them builds for i386 and for ARM; a2oberon keeps a moduleListLinuxARM.txt that is byte for byte
# the Linux one, and a second copy of a list is a second thing to forget to update.
Linux32:
  DEFINES: "--define=UNIX,I386"
  FILEFORMAT: ""
  EXTENSION: "GofU"
  SYMBOLFILEEXCEPTION: ".SymU"
  COMPILEOPTIONS: "-p=Unix32"
  FILENAME: "oberon"
  DISPLACEMENT: ""
  MODULE_LIST: "configs/moduleListLinux.txt"

LinuxARM:
  DEFINES: "--define=UNIX,ARM"
  FILEFORMAT: ""
  EXTENSION: "GofA"
  SYMBOLFILEEXCEPTION: ".SymA"
  COMPILEOPTIONS: "-p=UnixARM"
  FILENAME: "oberon"
  DISPLACEMENT: ""
  MODULE_LIST: "configs/moduleListLinux.txt"
