            [ -z "$A64_REQUIRE" ] || { echo "[FAIL] the A64 collector check needs qemu-user and an AArch64 C library, and A64_REQUIRE is set"; exit 1; }
            echo "[SKIP] the A64 collector check needs qemu-user and an AArch64 C library"
