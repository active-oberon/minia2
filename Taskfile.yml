  sdk:
    desc: Rebuild the SDK image that `ob` runs (IMAGE=… TAG=…)
    vars:
      IMAGE: '{{.IMAGE | default "minia2-sdk"}}'
      TAG: '{{.TAG | default "latest"}}'
    preconditions:
      - sh: "command -v docker >/dev/null"
        msg: "docker not found — the SDK image cannot be rebuilt without it"
      - sh: "test -f {{.CURRENT_DIR}}/docker/Dockerfile"
        msg: "docker/Dockerfile not found"
    cmds:
      # The compiler `ob` runs is neither source/ nor target/: it is the object files
      # baked into the image — /opt/a2sdk/lib/*.GofUu, the code generator among them —
      # and they are copied in once, at image build time. Editing source/ does not touch
      # them, and neither does `task Linux64`; only rebuilding the image does, because
      # the tree is compiled inside the builder stage. Skipping this step is why a fixed
      # compiler can still look broken under `ob`: the image keeps serving the code
      # generator it was built with.
      #
      # TAG defaults to latest because the usual alias is untagged
      # (`docker run --rm -v "$PWD:/work" minia2-sdk`), which resolves to :latest. Pass
      # TAG=… to build a throwaway tag and leave :latest alone.
      - echo "Building SDK image {{.IMAGE}}:{{.TAG}} — the tree is compiled inside the image"
      # SDK_VERSION has to be passed in: .git is not in the build context.
      - |
        docker build -f docker/Dockerfile -t {{.IMAGE}}:{{.TAG}} \
          --build-arg "SDK_VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" .
      - task: sdk-check
        vars:
          IMAGE: "{{.IMAGE}}"
          TAG: "{{.TAG}}"

  sdk-check:
    desc: Smoke-test the compiler inside an SDK image (IMAGE=… TAG=…)
    vars:
      IMAGE: '{{.IMAGE | default "minia2-sdk"}}'
      TAG: '{{.TAG | default "latest"}}'
    preconditions:
      - sh: "command -v docker >/dev/null"
        msg: "docker not found"
      - sh: "docker image inspect {{.IMAGE}}:{{.TAG}} >/dev/null 2>&1"
        msg: "no such image: {{.IMAGE}}:{{.TAG}} — build it with `task sdk`"
    cmds:
      # Compiles and runs one module through `ob` inside the image, so the check covers
      # the code generator the image actually serves rather than the one in target/.
      # The divisions below are unsigned and by a variable -- the shape that traps when
      # the code generator forgets to clear the high half of the dividend. A trap makes
      # `ob run` exit non-zero, so a stale image fails this task instead of passing
      # quietly. Keep the module dependency-free: it has to compile against nothing but
      # the SDK's own library.
      - |
        set -eo pipefail
        d="$(mktemp -d)"
        trap 'rm -rf "$d"' EXIT
        cat > "$d/SdkCheck.Mod" <<'MOD'
        MODULE SdkCheck;
        PROCEDURE Do*;
        VAR x16, d16, q16: UNSIGNED16; x8, d8, q8: UNSIGNED8;
        BEGIN
        	x16 := 65535; d16 := 10; q16 := x16 DIV d16; ASSERT (q16 = 6553);
        	x16 := 65535; d16 := 10; q16 := x16 MOD d16; ASSERT (q16 = 5);
        	x8 := 255; d8 := 2; q8 := x8 DIV d8; ASSERT (q8 = 127);
        END Do;
        END SdkCheck.
        MOD
        docker run --rm -v "$d:/work" {{.IMAGE}}:{{.TAG}} run SdkCheck.Mod
        echo "{{.IMAGE}}:{{.TAG}}: the compiler inside the image generates correct code"
      # Then the payload's own acceptance test -- the same run.sh the tarball ships, over every
      # verb -- so the image and the tarball answer the same questions. Results go to the mount:
      # /opt/a2sdk is not writable here.
      - |
        set -eo pipefail
        d="$(mktemp -d)"
        trap 'rm -rf "$d"' EXIT
        docker run --rm -v "$d:/work" -e A2_RESULTS=/work/results \
          --entrypoint bash {{.IMAGE}}:{{.TAG}} /opt/a2sdk/run.sh --quick

  update:
    desc: Bring this machine's SDK up to the tree -- build, bundle, install (A64=1 adds AArch64)
    # What "the SDK" means here is three things in a row, and forgetting one is the usual way to
    # spend an hour on a defect that was fixed already: the tree is compiled (target/<host>/bin),
    # the bundle is assembled from it (target/bundle, which is what ./ob runs), and the bundle is
    # installed (~/.local/share/a2sdk, which is what plain `ob` runs). The AArch64 objects are a
    # fourth and are built only on request: they are minutes, and only `ob build -t a64` and the
    # A64 suites read them.
    cmds:
      - task: "{{.HOST}}"
      - task: bundle
      - |
        set -eo pipefail
        case "$(uname -m)" in
          x86_64) flavour=linux-amd64 ;;
          aarch64|arm64) flavour=linux-arm64 ;;
          *) echo "[SKIP] no tarball flavour for $(uname -m); the bundle in {{.BUILD_DIR}}/bundle is current"; exit 0 ;;
        esac
        tarball="$(ls -t {{.BUILD_DIR}}/minia2-sdk-*-$flavour.tar.gz 2>/dev/null | head -1)"
        [ -n "$tarball" ] || { echo "no tarball to install -- did task bundle run?" >&2; exit 1; }
        sh {{.CURRENT_DIR}}/sdk/install.sh --tarball "$tarball"
      - |
        set -eo pipefail
        if [ -n "$A64" ]; then
          echo "== the AArch64 objects as well"
          task a64-stdlib
        else
          echo "(AArch64 objects left as they were -- A64=1 task update builds them too)"
        fi

  bundle:
    desc: Assemble the SDK as a tarball that needs no Docker (target/bundle + .tar.gz)
    cmds:
      - |
        set -eo pipefail
        {{.CURRENT_DIR}}/tests/bundle.sh -o {{.BUILD_DIR}}/bundle {{.BUILD_DIR}}/{{.HOST}} || {
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "[SKIP] bundling the SDK needs a built host compiler (task {{.HOST}})"
          else
            exit "$status"
          fi
        }

  bundle-check:
    desc: Unpack the tarball SDK elsewhere and use it with an empty environment (BUNDLE_FULL=1 adds the suites)
    cmds:
      - |
        set -eo pipefail
        {{.CURRENT_DIR}}/tests/bundle-check.sh {{.BUILD_DIR}}/{{.HOST}} || {
          status=$?
          if [ "$status" -eq 2 ]; then
            # Same rule as the A64 checks: where a build is meant to exist -- CI -- a silent skip
            # is the check not running at all, which reads the same as it passing.
            [ -z "$BUNDLE_REQUIRE" ] || { echo "[FAIL] checking the tarball SDK needs a built host compiler, and BUNDLE_REQUIRE is set"; exit 1; }
            echo "[SKIP] checking the tarball SDK needs a built host compiler (task {{.HOST}})"
          else
            exit "$status"
          fi
        }

  install-check:
    desc: Check sdk/install.sh (curl | sh) against the tarball this tree builds — offline
    cmds:
      - |
        set -eo pipefail
        # The tarball is what is being installed, so it is assembled first if it is not there.
        ls {{.BUILD_DIR}}/minia2-sdk-*-linux-amd64.tar.gz >/dev/null 2>&1 || task bundle
        {{.CURRENT_DIR}}/tests/install-check.sh {{.BUILD_DIR}}/{{.HOST}} || {
          status=$?
          if [ "$status" -eq 2 ]; then
            [ -z "$BUNDLE_REQUIRE" ] || { echo "[FAIL] checking the installer needs a tarball, and BUNDLE_REQUIRE is set"; exit 1; }
            echo "[SKIP] checking the installer needs a tarball (task bundle)"
          else
            exit "$status"
          fi
        }

  clean:
    desc: Remove build artifacts for one platform (PLATFORM=… or host)
    vars:
      PLATFORM: "{{.PLATFORM | default .HOST}}"
    cmds:
      - rm -rf {{.BUILD_DIR}}/{{.PLATFORM}}
      - echo "Cleaned build artifacts for {{.PLATFORM}}"

  clean-all:
    desc: Remove all build artifacts (every platform)
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - echo "Cleaned all build artifacts"

  help:
    desc: Display help message
    cmds:
      - 'echo "task <platform>            — build a single platform from the list: [{{.PLATFORMS}}]"'
      - 'echo "task build-platform PLATFORM=Linux64 — same, generic form"'
      - echo "task platforms             — build all platforms"
      - echo "task test                  — run compiler tests"
      - 'echo "task bundle                — the SDK as a tarball, no Docker needed to use it"'
      - 'echo "task bundle-check          — unpack that tarball elsewhere and use it with an empty environment"'
      - 'echo "task sdk [IMAGE=… TAG=…]    — rebuild the SDK image that ob runs (default minia2-sdk:latest)"'
      - 'echo "task sdk-check [IMAGE=… TAG=…] — check the compiler inside an existing SDK image"'
      - 'echo "task clean [PLATFORM=…]     — remove build artifacts for one platform (host by default)"'
      - echo "task clean-all             — remove build artifacts for every platform"
      - echo "task help                  — display this help message"
      - echo "task --list                — list all available tasks"
