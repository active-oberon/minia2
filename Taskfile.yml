        set -eo pipefail
        {{.CURRENT_DIR}}/tests/a64-sysroot.sh {{.BUILD_DIR}}/A64/sysroot || {
          status=$?
          if [ "$status" -eq 2 ]; then
            # A64_REQUIRE turns a skip into a failure: on a machine that is meant to have the
            # tools -- CI -- a silent skip is the check not running at all, which reads the same
            # as it passing.
            [ -z "$A64_REQUIRE" ] || { echo "[FAIL] unpacking an AArch64 C library needs docker, and A64_REQUIRE is set"; exit 1; }
            echo "[SKIP] unpacking an AArch64 C library needs docker"
          else
            exit "$status"
          fi
        }

