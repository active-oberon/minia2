stages:
  - build
  - test
  - package
  - container
  - release

default:
  image: debian:latest
  before_script:
    - apt update && apt install -y curl git git-lfs wget
    - curl -sL https://taskfile.dev/install.sh | sh
    - mv ./bin/task /usr/local/bin/task
    - wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
    - chmod +x /usr/local/bin/yq
    - yq --version
    - task --version
    - git lfs install
    - git lfs pull

# minia2 builds Linux64 + Win64 only (both from the Linux64 bootstrap compiler).
build:
  stage: build
  script:
    - task Linux64
    - task Win64
  artifacts:
    paths:
      - target/Linux64
      - target/Win64

test:
  stage: test
  script:
    - task test

# Runs only on CalVer tags (YYYY.MM.DD, optional .N for a second build the
# same day). No `needs:` on purpose — stage ordering makes package wait for
# the whole `test` stage to pass, so a broken build can never be released.
# Build artifacts (target/*) are downloaded automatically from earlier stages.
package:
  stage: package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d{4}\.\d{2}\.\d{2}(\.\d+)?$/'
  before_script:
    - apt update && apt install -y curl zip
  script:
    - |
      set -eu
      for P in Linux64 Win64; do
        archive="minia2-$P-$CI_COMMIT_TAG.zip"
        (cd target && zip -r "../$archive" "$P")
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$archive" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/minia2/${CI_COMMIT_TAG}/${archive}"
        echo "[SUCCESS] published $archive"
      done
  artifacts:
    paths:
      - "minia2-*-*.zip"
    expire_in: 1 week

# Builds the Active Oberon SDK Docker image (docker/Dockerfile) and pushes it to
# this project's GitLab Container Registry. The Dockerfile is self-contained — it
# rebuilds the toolchain from source — so this job needs no artifacts from earlier
# stages (dependencies: []). Runs automatically on CalVer release tags, and can be
# triggered manually from the default branch. Needs a Docker-executor runner with
# a dind service (gitlab.com shared runners qualify).
container:
  stage: container
  image: docker:27
  services:
    - docker:27-dind
  dependencies: []
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_BUILDKIT: "1"
    IMAGE: "$CI_REGISTRY_IMAGE/sdk"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d{4}\.\d{2}\.\d{2}(\.\d+)?$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - TAG="${CI_COMMIT_TAG:-latest}"
    - docker build -f docker/Dockerfile -t "$IMAGE:$TAG" .
    - docker push "$IMAGE:$TAG"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$TAG" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi
    - echo "[SUCCESS] pushed $IMAGE:$TAG"
    # Also mirror to Docker Hub when credentials are configured (CI/CD variables
    # DOCKERHUB_USER + DOCKERHUB_TOKEN). Skipped silently if unset.
    - |
      if [ -n "${DOCKERHUB_USER:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin docker.io
        HUB="docker.io/$DOCKERHUB_USER/minia2-sdk"
        docker tag "$IMAGE:$TAG" "$HUB:$TAG"
        docker push "$HUB:$TAG"
        if [ -n "$CI_COMMIT_TAG" ]; then
          docker tag "$IMAGE:$TAG" "$HUB:latest"
          docker push "$HUB:latest"
        fi
        echo "[SUCCESS] pushed $HUB:$TAG"
      else
        echo "[SKIP] Docker Hub push (set DOCKERHUB_USER + DOCKERHUB_TOKEN to enable)"
      fi

# Creates a GitLab Release for the tag with download links pointing at the
# archives published to the Generic Package Registry by the package job.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []          # release-cli image is alpine; skip the debian setup
  dependencies: []           # no artifacts needed, just the links below
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d{4}\.\d{2}\.\d{2}(\.\d+)?$/'
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "minia2 $CI_COMMIT_TAG"
    description: "Automated build for $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Linux64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/minia2/${CI_COMMIT_TAG}/minia2-Linux64-${CI_COMMIT_TAG}.zip"
          link_type: package
        - name: "Win64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/minia2/${CI_COMMIT_TAG}/minia2-Win64-${CI_COMMIT_TAG}.zip"
          link_type: package
