name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install task + yq
        run: |
          curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b "$HOME/.local/bin"
          wget -qO "$HOME/.local/bin/yq" https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the AArch64 toolchain the A64 checks run against
        # Without these the A64 checks skip, and a skip reads exactly like a pass: the code
        # generator, the collector and the write barriers on AArch64 would then be covered by
        # nothing. A64_REQUIRE below turns a skip into a failure, so this step is what keeps
        # that from firing. qemu-user-static runs the AArch64 binaries, libc6-arm64-cross is
        # the C library they are dynamically linked against, and llvm brings llvm-mc, which the
        # encoder is checked against.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static libc6-arm64-cross llvm
      - name: Install wine, which is what runs the Windows SDK here
        # ob is a Windows binary now, not a shell script, so the only way to answer for the Windows
        # SDK on a Linux runner is to run it. Without wine the Windows part of `task ob` skips, and
        # a skip reads exactly like a pass.
        run: sudo apt-get install -y --no-install-recommends wine64
      - name: Build (Linux64 + Win64)
        run: |
          task Linux64
          task Win64
      - name: Test (compiler suites via task)
        env:
          A64_REQUIRE: "1"
        run: task test
      - name: A64 standard library and self hosting
        # `task test` covers the A64 backend, the runtime, module loading and the collector; it
        # stops short of the standard library, which is minutes of compiling, and therefore of the
        # compiler on AArch64. This step builds that and then has the AArch64 system compile a
        # module on itself and run what it built, which is what `ob run`, the REPL and the language
        # server on that target all reduce to.
        env:
          A64_REQUIRE: "1"
        run: |
          task a64-stdlib
          task a64-selfhost
      - name: AArch64 tarball SDK (assembled here, not first at release time)
        # This bundle compiles a dozen modules the headless standard library does not carry, and a
        # missing one is invisible until something tries. Nothing did until a release did: the task
        # ran only from release.yml, and passed on a developer's machine whose objects directory
        # had leftovers. Here that directory holds exactly what a64-stdlib put there.
        env:
          A64_REQUIRE: "1"
        run: task a64-bundle
      - name: A64 test suites (push to main only — it is the better part of an hour)
        # Every tests/*.Test case compiled for AArch64, and executed under qemu where the suite
        # executes: the two language suites are 5450 compilation and 695 execution cases, the same
        # ones that run on x86-64, which is what turns "the backend looks correct" into a number.
        # Only on push: an emulated hour on every pull request would cost more than it catches.
        if: github.event_name == 'push'
        env:
          A64_REQUIRE: "1"
        run: task a64-suites
      - name: Second stage (compile the tree with the freshly built compiler)
        # `task Linux64` compiles the tree with the committed bootstrap in compilers/, so a
        # patch to the compiler itself is never exercised by it -- the new binary is produced
        # but nothing is compiled by it. This step feeds the tree back through the compiler
        # just built, which is what catches a patch that changes what the compiler accepts.
        # Run on a copy: Release.Build writes into bin/ next to the binary it is running.
        run: |
          STAGE2="$RUNNER_TEMP/stage2"
          cp -a target/Linux64 "$STAGE2"
          cp target/Linux64/oberon "$RUNNER_TEMP/oberon-stage1"
          chmod +x "$RUNNER_TEMP/oberon-stage1"
          cat > "$STAGE2/oberonCompile.cfg" <<EOF
          Heaps.SetMetaData~
          Files.AddSearchPath $STAGE2/bin~
          Files.AddSearchPath data~
          Files.AddSearchPath source~
          Configuration.Init~
          EOF
          cd "$STAGE2"
          export PWD="$(pwd)"
          "$RUNNER_TEMP/oberon-stage1" do "
            System.DoFile oberonCompile.cfg ~
            Files.SetWorkPath $STAGE2 ~
            Release.Build --build --path=bin/ --exclude=\"Oberon OberonGadgets OberonApplications OberonVoyager OberonAnts OberonDocumentation Fun Education Testing EFI CjkFonts Pr3Fonts Pr6Fonts\" Linux64 ~
          " | tee "$RUNNER_TEMP/stage2.log"
          # Release.Build reports a failed module as an error line and still exits 0
          if grep -qE '^\s+[A-Za-z0-9_.]+\.Mod.*error:' "$RUNNER_TEMP/stage2.log"; then
            echo "::error::second stage failed to compile the tree"
            grep -E '^\s+[A-Za-z0-9_.]+\.Mod.*error:' "$RUNNER_TEMP/stage2.log"
            exit 1
          fi
      - name: Test (all tests/ suites via ob test)
        # `task test` only drives the two Oberon.Compilation/Execution suites; this runs
        # every tests/*.Test file through the SDK's `ob test`. No Docker image needed —
        # `ob` only wants an SDK layout ($A2SDK/oberon + $A2SDK/lib), which the freshly
        # built target/Linux64 tree provides. Cases in tests/a2test-expected.txt are
        # known-failing and do not break the build; one of them starting to pass does.
        run: |
          mkdir -p "$RUNNER_TEMP/a2sdk/lib"
          ln -s "$PWD/target/Linux64/oberon" "$RUNNER_TEMP/a2sdk/oberon"
          ln -s "$PWD"/target/Linux64/bin/*.SymUu "$PWD"/target/Linux64/bin/*.GofUu \
                "$RUNNER_TEMP/a2sdk/lib/"
          cd tests && A2SDK="$RUNNER_TEMP/a2sdk" bash ../docker/ob test \
            --report "$RUNNER_TEMP/ob-test-report.json"
      - name: Tarball SDK (assemble it, unpack it elsewhere, use it with an empty environment)
        # Unpacks the tarball into a temporary directory and runs the bundle's own run.sh under
        # `env -i`, so anything the SDK cannot find beside itself fails here rather than in a
        # stranger's download. BUNDLE_REQUIRE: this job has a build, so a skip would mean the
        # step did nothing.
        env:
          BUNDLE_REQUIRE: "1"
        run: task bundle-check
      - name: ob, the driver written in Active Oberon (and the Windows SDK, under wine)
        # Builds ob from source/Ob.Mod, checks every verb against the shell version it replaces --
        # the three binaries `ob build` produces are compared byte for byte -- then builds the
        # Windows bundle and drives ob.exe inside it under wine.
        run: task ob
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ob-test-report
          path: ${{ runner.temp }}/ob-test-report.json
          if-no-files-found: warn
