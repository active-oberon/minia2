name: Container
on:
  push:
    branches: [main]
    tags: ['[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*']
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          HUB=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/minia2-sdk
          if [ -n "${GITHUB_REF_NAME}" ] && echo "$GITHUB_REF_TYPE" | grep -q tag; then
            echo "tags=$HUB:${GITHUB_REF_NAME},$HUB:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$HUB:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
