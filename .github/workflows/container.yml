name: Container
on:
  push:
    branches: [main]
    tags: ['[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*']
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v3
      # Docker Hub's auth endpoint (auth.docker.io, behind Cloudflare) resets
      # connections often enough to fail a run outright, so both the login and
      # the build+push retry with backoff instead of using docker/login-action.
      - name: Log in to Docker Hub
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            if echo "$HUB_TOKEN" | docker login -u "$HUB_USER" --password-stdin docker.io; then exit 0; fi
            echo "::warning::docker login attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1
      - name: Compute tags
        id: tags
        run: |
          HUB=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/minia2-sdk
          if [ -n "${GITHUB_REF_NAME}" ] && echo "$GITHUB_REF_TYPE" | grep -q tag; then
            echo "tags=$HUB:${GITHUB_REF_NAME},$HUB:latest" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$HUB:latest" >> "$GITHUB_OUTPUT"
            echo "version=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      # Plain buildx instead of docker/build-push-action so the whole build+push
      # can be retried in-shell. --provenance=false keeps each tag a single plain
      # image manifest (no attestation index), matching the pre-Actions builds.
      - name: Build + push
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          # What `ob version` prints inside the image: git is not in the build context, so the
          # payload cannot work it out for itself.
          SDK_VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -u
          TAG_ARGS=""
          IFS=','; for t in $TAGS; do TAG_ARGS="$TAG_ARGS -t $t"; done; unset IFS
          for i in 1 2 3; do
            if docker buildx build --push --provenance=false \
                 --build-arg "SDK_VERSION=$SDK_VERSION" \
                 -f docker/Dockerfile $TAG_ARGS .; then exit 0; fi
            echo "::warning::build+push attempt $i failed; retrying in $((i * 30))s"
            sleep $((i * 30))
          done
          exit 1
      # The page people read before they pull anything. It used to be pasted in by hand and
      # was therefore always one release behind; it is docker/README.md now, uploaded here.
      - name: Docker Hub description
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          docker/hub-description.sh > "$RUNNER_TEMP/hub.md"
          token="$(curl -sS -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg u "$HUB_USER" --arg p "$HUB_TOKEN" '{username:$u,password:$p}')" \
            | jq -r '.token // empty')"
          [ -n "$token" ] || { echo "::error::could not get a Docker Hub token"; exit 1; }
          status="$(curl -sS -o "$RUNNER_TEMP/hub-response.json" -w '%{http_code}' \
            -X PATCH "https://hub.docker.com/v2/repositories/$HUB_USER/minia2-sdk/" \
            -H "Authorization: JWT $token" -H 'Content-Type: application/json' \
            -d "$(jq -n --rawfile d "$RUNNER_TEMP/hub.md" '{full_description:$d}')")"
          if [ "$status" != "200" ]; then
            echo "::error::Docker Hub refused the description (HTTP $status)"
            cat "$RUNNER_TEMP/hub-response.json"; exit 1
          fi
          echo "description updated ($(wc -c < "$RUNNER_TEMP/hub.md") bytes)"
