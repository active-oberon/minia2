name: Container
on:
  push:
    branches: [main]
    tags: ['[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*']
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v3
      # Docker Hub's auth endpoint (auth.docker.io, behind Cloudflare) resets
      # connections often enough to fail a run outright, so both the login and
      # the build+push retry with backoff instead of using docker/login-action.
      - name: Log in to Docker Hub
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            if echo "$HUB_TOKEN" | docker login -u "$HUB_USER" --password-stdin docker.io; then exit 0; fi
            echo "::warning::docker login attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1
      - name: Compute tags
        id: tags
        run: |
          HUB=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/minia2-sdk
          if [ -n "${GITHUB_REF_NAME}" ] && echo "$GITHUB_REF_TYPE" | grep -q tag; then
            echo "tags=$HUB:${GITHUB_REF_NAME},$HUB:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$HUB:latest" >> "$GITHUB_OUTPUT"
          fi
      # Plain buildx instead of docker/build-push-action so the whole build+push
      # can be retried in-shell. --provenance=false keeps each tag a single plain
      # image manifest (no attestation index), matching the pre-Actions builds.
      - name: Build + push
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -u
          TAG_ARGS=""
          IFS=','; for t in $TAGS; do TAG_ARGS="$TAG_ARGS -t $t"; done; unset IFS
          for i in 1 2 3; do
            if docker buildx build --push --provenance=false \
                 -f docker/Dockerfile $TAG_ARGS .; then exit 0; fi
            echo "::warning::build+push attempt $i failed; retrying in $((i * 30))s"
            sleep $((i * 30))
          done
          exit 1
