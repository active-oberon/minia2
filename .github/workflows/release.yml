name: Release
on:
  push:
    tags: ['[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0          # the SDK version comes from `git describe`
      - name: Install task + yq
        run: |
          curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b "$HOME/.local/bin"
          wget -qO "$HOME/.local/bin/yq" https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build (Linux64 + Win64)
        run: |
          task Linux64
          task Win64
      - name: Package zips
        run: |
          for P in Linux64 Win64; do (cd target && zip -r "../minia2-$P-${GITHUB_REF_NAME}.zip" "$P"); done
      # The SDK as a tarball: unpack, run ./ob. The AArch64 objects come first because the host
      # bundle carries them as a cross target (`ob build -t a64`).
      - name: AArch64 objects (for the cross target and the AArch64 SDK)
        env:
          A64_REQUIRE: "1"
        run: |
          tests/a64-runtime-check.sh target/Linux64 target/A64/bin
          task a64-stdlib
      - name: Tarball SDK (x86-64 Linux) + check it
        env:
          BUNDLE_REQUIRE: "1"
        run: |
          task bundle-check          # assembles a bundle of its own and uses it under `env -i`
          task bundle                # the one that is published
          cp target/*.tar.gz .
      # The SDK for a 64-bit ARM machine -- a Pi 4/5, an ARM server, a phone under Termux. There
      # a64 is not a cross target: the compiler runs on the device.
      - name: Tarball SDK (AArch64)
        env:
          A64_REQUIRE: "1"
        run: |
          task a64-bundle
          # Renamed so the two SDKs sit side by side on the release page; inside it still unpacks
          # into a2-a64/, which is what its own README says to cd into.
          cp target/A64/bundle.tar.gz "minia2-sdk-${GITHUB_REF_NAME}-linux-arm64.tar.gz"
      # The same device, without proot: Bionic. A separate asset because the loader and the one
      # library the image names are read before any of our code runs, so they cannot be decided on
      # the phone. The NDK is on the runner image already; A64_REQUIRE turns a missing one into a
      # failure rather than a silent skip that reads like a pass.
      - name: Tarball SDK (Android/Bionic)
        env:
          A64_REQUIRE: "1"
          ANDROID_NDK: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          task a64-bundle-android
          cp target/A64/bundle-android.tar.gz "minia2-sdk-${GITHUB_REF_NAME}-android-arm64.tar.gz"
      # The third host. ob is a Windows binary here, not a shell script, so this SDK needs neither
      # bash nor WSL nor Docker on the machine it lands on. Built by cross-compilation, which is
      # why it is produced on this Linux runner like the other two.
      - name: Tarball SDK (Windows)
        run: |
          task win-bundle
          cp target/minia2-sdk-*-windows-amd64.tar.gz .
      # sdk/install.sh is what `curl | sh` runs, so it is checked against the tarball this run
      # built before that tarball is published -- the installer and the thing it installs are
      # released together and there is no version of one that has not met the other.
      - name: Check the installer against the tarball
        run: tests/install-check.sh
      # Checksums for the assets. install.sh verifies against this file when the release has one;
      # a release without it installs anyway and says the checksum was not verified.
      - name: Checksums
        run: sha256sum minia2-*-*.zip minia2-sdk-*.tar.gz > SHA256SUMS
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "minia2 ${{ github.ref_name }}"
          files: |
            minia2-*-*.zip
            minia2-sdk-*.tar.gz
            SHA256SUMS
            sdk/install.sh
